---
name: Release – Phase 1

on:
  schedule:
    - cron: 0 9 15 */3 * # Run every quarter on the 15th day.
  workflow_dispatch: null

permissions: {}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.PR_METRICS_TOKEN }}

      - name: Release – Phase 1 – Internal
        uses: ./.github/actions/release-phase-1-internal
        with:
          major: 1
          minor: 7
          patch: 12
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pr-metrics-token: ${{ secrets.PR_METRICS_TOKEN }}
